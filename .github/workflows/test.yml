name: Test Game Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        java: [ '17', '21' ]

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'

    - name: Cache Maven packages
      uses: actions/cache@v3
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Build game
      run: mvn clean package -B

    - name: Verify executable jar
      run: |
        if [ -f "target/loz-game-1.0-SNAPSHOT.jar" ]; then
          echo "✓ Game JAR created successfully"
          jar tf target/loz-game-1.0-SNAPSHOT.jar | grep -q "com/mservices/games/App.class" && echo "✓ App.class found in JAR"
        else
          echo "✗ Game JAR not found"
          exit 1
        fi

